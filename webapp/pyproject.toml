[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diskviz-api"
version = "0.1.0"
description = "diskviz FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "aiosqlite>=0.20",
    "send2trash>=1.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "httpx>=0.27",
    "ruff>=0.4",
]
e2e = [
    "playwright>=1.40",
]

[project.scripts]
diskviz-serve = "diskviz_api.main:main"

[tool.setuptools.packages.find]
include = ["diskviz_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
